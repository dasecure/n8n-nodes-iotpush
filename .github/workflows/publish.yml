name: Publish to npm

# Publishes n8n-nodes-iotpush with PROVENANCE, authenticating with a granular
# access token.
#
# Provenance and authentication are two separate things, which is easy to miss:
#   - AUTH comes from NPM_TOKEN (a granular access token, Read and write on this
#     package). Classic tokens were revoked in Dec 2025.
#   - PROVENANCE comes from `--provenance` plus `id-token: write`. The sigstore
#     attestation is signed with a GitHub OIDC token, NOT with NPM_TOKEN.
#
# So this workflow produces a verified provenance badge without depending on
# npm trusted publishing. Trusted publishing only replaces the AUTH half; it is
# nicer (no credential to rotate) but it is not required for provenance.
#
# Requires: repo public, package public, NPM_TOKEN secret set.
#   gh secret set NPM_TOKEN --repo dasecure/n8n-nodes-iotpush
#
# TO MIGRATE TO TRUSTED PUBLISHING LATER:
#   1. npmjs.com -> package Settings -> Trusted Publisher -> GitHub Actions
#      org: dasecure  repo: n8n-nodes-iotpush  workflow: publish.yml  env: blank
#   2. Remove `registry-url` from setup-node below (it writes an _authToken line
#      that suppresses the OIDC exchange -- see actions/setup-node#1551).
#   3. Drop the NODE_AUTH_TOKEN env and the --provenance flag from publish
#      (trusted publishing attaches provenance automatically).
#   4. Delete the NPM_TOKEN secret.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: false
      npm_version:
        description: 'npm version to install'
        type: string
        default: 'latest'

permissions:
  contents: read
  id-token: write # REQUIRED for provenance. Without it, --provenance fails.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Needed here: it writes the .npmrc that wires NODE_AUTH_TOKEN through
          # to the registry. Remove it only if migrating to trusted publishing.
          registry-url: 'https://registry.npmjs.org'

      - name: Install a current npm
        run: |
          npm install -g "npm@${{ inputs.npm_version || 'latest' }}"
          echo "node $(node --version)"
          echo "npm  $(npm --version)"

      - name: Verify NPM_TOKEN is present
        # Fail with a clear message rather than letting npm emit its misleading
        # 404 ("not found or you do not have permission") for an empty credential.
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Run: gh secret set NPM_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "NPM_TOKEN is set (length ${#NPM_TOKEN})"
          case "$NPM_TOKEN" in
            npm_*) echo "Format looks like a granular access token." ;;
            *)     echo "::warning::Token does not start with npm_. Classic tokens were revoked in Dec 2025." ;;
          esac
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify provenance prerequisites
        # Provenance is signed with a GitHub OIDC token. If id-token: write is
        # not in effect, --provenance fails late and confusingly.
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL missing. id-token: write is not in effect, so --provenance cannot work. Check Settings -> Actions -> General -> Workflow permissions."
            exit 1
          fi
          echo "OIDC request URL present; provenance signing can proceed."
          echo "repository $GITHUB_REPOSITORY"
          echo "workflow   $GITHUB_WORKFLOW_REF"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Verify no runtime dependencies
        # n8n's community-node verification scan rejects runtime deps.
        run: |
          DEPS=$(node -p "JSON.stringify(require('./package.json').dependencies || {})")
          if [ "$DEPS" != "{}" ]; then
            echo "::error::Runtime dependencies present, n8n verification will fail: $DEPS"
            exit 1
          fi
          echo "No runtime dependencies. Good."

      - name: Verify repository field matches this repo
        # Provenance attestation resolves package.json repository.url; a mismatch
        # breaks verification.
        run: |
          REPO_URL=$(node -p "(require('./package.json').repository||{}).url || ''")
          echo "package.json repository.url = $REPO_URL"
          case "$REPO_URL" in
            *"$GITHUB_REPOSITORY"*) echo "Matches $GITHUB_REPOSITORY" ;;
            *) echo "::error::repository.url does not reference $GITHUB_REPOSITORY"; exit 1 ;;
          esac

      - name: Pack (dry run)
        if: inputs.dry_run
        run: npm pack --dry-run

      - name: Publish with provenance
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm provenance registered
        if: ${{ !inputs.dry_run }}
        run: |
          sleep 20
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "Verify at: https://www.npmjs.com/package/$PKG/v/$VER#provenance"
          npm view "$PKG@$VER" dist.attestations \
            || echo "Not indexed yet. Check the URL above in a few minutes."
