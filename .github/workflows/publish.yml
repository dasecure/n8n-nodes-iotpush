name: Publish to npm

# Publishes n8n-nodes-iotpush using npm TRUSTED PUBLISHING (OIDC).
#
# No NPM_TOKEN. No --provenance flag. Both are handled by the OIDC exchange:
# npm verifies this workflow's identity directly and generates the provenance
# attestation automatically, provided the repo AND the package are public.
#
# Classic/legacy npm tokens were disabled in Nov 2025 and revoked Dec 2025, so
# token-based publishing now requires a granular token that expires. Trusted
# publishing has no credential to rotate at all.
#
# ONE-TIME SETUP on npmjs.com (package settings -> Trusted Publisher):
#   Publisher:          GitHub Actions
#   Organization/user:  dasecure
#   Repository:         n8n-nodes-iotpush
#   Workflow filename:  publish.yml     <- must match THIS file's name exactly
#   Environment:        (leave blank)
#   Allowed actions:    npm publish
#
# Requires npm >= 11.5.1 and Node >= 22.14.0.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # REQUIRED. Without it the OIDC exchange fails and npm asks for a token instead.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # trusted publishing needs >= 22.14.0
          # DO NOT set registry-url here.
          #
          # registry-url makes setup-node write an .npmrc containing
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # and it defines NODE_AUTH_TOKEN even when no secret is supplied.
          # npm then sends an EMPTY credential and never attempts the OIDC
          # exchange. The registry answers PUT with 404 (it hides existence
          # from unauthenticated callers), which looks like "package not
          # found" for a package you own.
          #
          # See actions/setup-node#1551 and npm/cli#9088.

      - name: Upgrade npm for trusted publishing
        # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1.
        run: |
          npm install -g npm@latest
          npm --version
          node --version

      - name: Verify toolchain meets trusted-publishing minimums
        run: |
          node -e '
            const [nMaj, nMin] = process.versions.node.split(".").map(Number);
            if (nMaj < 22 || (nMaj === 22 && nMin < 14)) {
              console.error(`Node ${process.versions.node} too old, need >= 22.14.0`);
              process.exit(1);
            }
            console.log(`Node ${process.versions.node} OK`);
          '
          npm --version | awk -F. '{
            if ($1 < 11 || ($1 == 11 && ($2 < 5 || ($2 == 5 && $3 < 1)))) {
              print "npm too old for trusted publishing, need >= 11.5.1"; exit 1
            }
          }'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Verify no runtime dependencies
        # n8n's community-node verification scan rejects packages shipping runtime deps.
        # devDependencies and peerDependencies are fine.
        run: |
          DEPS=$(node -p "JSON.stringify(require('./package.json').dependencies || {})")
          if [ "$DEPS" != "{}" ]; then
            echo "::error::Runtime dependencies present, n8n verification will fail: $DEPS"
            exit 1
          fi
          echo "No runtime dependencies. Good."

      - name: Verify repository field matches this repo
        run: |
          REPO_URL=$(node -p "(require('./package.json').repository||{}).url || ''")
          echo "package.json repository.url = $REPO_URL"
          case "$REPO_URL" in
            *"$GITHUB_REPOSITORY"*) echo "Matches $GITHUB_REPOSITORY" ;;
            *) echo "::error::repository.url does not reference $GITHUB_REPOSITORY"; exit 1 ;;
          esac

      - name: Pack (dry run)
        if: inputs.dry_run
        run: npm pack --dry-run

      - name: Confirm no auth token is configured
        # Trusted publishing only engages when npm finds NO credential. If an
        # .npmrc auth line or a non-empty NODE_AUTH_TOKEN survives, npm uses it
        # and the OIDC exchange is skipped entirely.
        run: |
          echo "NODE_AUTH_TOKEN is ${NODE_AUTH_TOKEN:+SET (bad)}${NODE_AUTH_TOKEN:-unset (good)}"
          for f in "$HOME/.npmrc" "$NPM_CONFIG_USERCONFIG"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "--- $f ---"
              sed 's/=.*/=<redacted>/' "$f"
              if grep -q "_authToken" "$f"; then
                echo "::error::$f configures _authToken; trusted publishing will be bypassed."
                exit 1
              fi
            fi
          done
          echo "No auth token configured. OIDC will be used."
        env:
          NODE_AUTH_TOKEN: ''

      - name: Publish via trusted publishing
        if: ${{ !inputs.dry_run }}
        # No NPM_TOKEN and no --provenance: OIDC covers auth, and npm attaches
        # provenance automatically for a public repo + public package.
        run: npm publish --access public
        env:
          # Belt and braces: blank this even though registry-url is unset, so a
          # future edit re-adding registry-url cannot silently break OIDC again.
          NODE_AUTH_TOKEN: ''

      - name: Confirm provenance registered
        if: ${{ !inputs.dry_run }}
        run: |
          sleep 20
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "Verify at: https://www.npmjs.com/package/$PKG/v/$VER#provenance"
          npm view "$PKG@$VER" dist.attestations \
            || echo "Not indexed yet. Check the URL above in a few minutes."
